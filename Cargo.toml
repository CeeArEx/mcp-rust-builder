[package]
name = "mcp-rust-builder"
version = "0.1.0"
edition = "2024"


[dependencies]
rmcp = { version = "0.8.0", features = ["server"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "5.0"
scraper = "0.20"
thiserror = "1.0"
toml = "0.8"
bincode = "1.3"
directories = "5.0"
walkdir = "2.4"
regex = "1.10"
syn = {version = "2.0.110", features = ["full", "visit"]}
quote = "1.0.42"